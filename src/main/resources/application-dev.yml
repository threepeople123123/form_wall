spring:
  data:
    # redis配置
    redis:
      # Redis数据库索引（默认为0）
      database: 1
      # Redis服务器地址
      host: localhost
      # Redis服务器连接端口
      port: 6379
      # Redis服务器连接密码（默认为空）
      password: wangjian020426
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 100
          # 连接池最大阻塞等待时间
          max-wait: 2000ms
          # 连接池中的最大空闲连接
          max-idle: 30
          # 连接池中的最小空闲连接
          min-idle: 10
      connect-timeout: 10s
  datasource:
    url: jdbc:postgresql://localhost:5432/campus-future
    username: postgres
    password: wangjian020426
    driver-class-name: org.postgresql.Driver
    # 可选：连接池配置 (推荐使用 HikariCP，Spring Boot 默认)
    hikari:
      # 最小空闲连接数
      minimum-idle: 5
      # 最大连接数
      maximum-pool-size: 20
      # 连接超时时间（毫秒）
      connection-timeout: 30000
      # 连接最大存活时间（毫秒）
      max-lifetime: 1800000
  mail:
    host: smtp.qq.com
    port: 465 # 或者 587
    username: 1994814695@qq.com
    password: lpclwlacqopldgca
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # 如果使用 465 端口，通常需要启用 SSL
          ssl:
            enable: true
  jackson:
    serialization:
      # 建议禁用这个，否则日期会变成一串数字数组 [2023,10,27...]
      write-dates-as-timestamps: false
  # RabbitMQ 配置
  rabbitmq:
    host: localhost  # RabbitMQ 服务器地址
    port: 5672       # RabbitMQ 端口
    username: admin  # 用户名
    password: password123  # 密码
    virtual-host: /  # 虚拟主机
    listener:
      simple:
        # 消费者最小线程数
        concurrency: 5
        # 消费者最大线程数
        max-concurrency: 10
        # 手动确认消息
        acknowledge-mode: manual
        # 每次从队列中取出的消息数
        prefetch: 1
############## Sa-Token 配置 (文档: https://sa-token.cc) ##############
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: token
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: false
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: true
